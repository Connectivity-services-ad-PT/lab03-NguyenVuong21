openapi: 3.1.0
info:
  title: Campus IoT and Core Business Event Contract
  version: 1.0.0
  description: API chuẩn hóa minh chứng Lab 02 và Lab 03 cho hệ thống hướng sự kiện nhóm B1.
  contact:
    name: Nguyen Kim Duc Vuong
    email: nguyenvuonggg76@gmail.com
tags:
  - name: System
    description: Các endpoint kiểm tra hệ thống
  - name: Sensors
    description: Tiếp nhận dữ liệu từ cảm biến IoT
  - name: Alerts
    description: Quản lý các cảnh báo trong Campus
paths:
  /health:
    get:
      summary: Check health status
      description: Kiểm tra trạng thái hoạt động của hệ thống Ingestion Server.
      operationId: checkHealth
      tags:
        - System
      responses:
        '200':
          description: Server hoạt động bình thường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/v1/sensors/readings:
    post:
      summary: Tiếp nhận dữ liệu cảm biến IoT
      description: Nhận và xử lý các thông số nhiệt độ truyền về từ các thiết bị cảm biến trong campus.
      operationId: ingestSensorReading
      tags:
        - Sensors
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sensorId
                - temperature
              properties:
                sensorId:
                  type: string
                  example: "SENS-001"
                temperature:
                  type: number
                  minimum: -50
                  maximum: 100
                  example: 23.5
      responses:
        '201':
          description: Tiếp nhận dữ liệu thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - readingId
                  - status
                properties:
                  readingId:
                    type: string
                    format: uuid
                    example: "3eec9f11-d6ef-4123-8c4c-a9d9dab75191"
                  status:
                    type: string
                    example: "ACCEPTED"
        '400':
          description: Dữ liệu đầu vào không hợp lệ (Sai định dạng Payload)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Chưa xác thực (Thiếu hoặc sai Token)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Lỗi xử lý dữ liệu hoặc giá trị vượt biên nghiệp vụ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /alerts/recent:
    get:
      summary: Lấy danh sách cảnh báo gần đây
      description: Trả về danh sách các cảnh báo mới nhất hệ thống ghi nhận được yêu cầu quyền truy cập từ quản trị viên.
      operationId: getRecentAlerts
      tags:
        - Alerts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertMessage'
        '401':
          description: Chưa xác thực
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /alerts/{id}:
    get:
      summary: Lấy chi tiết một cảnh báo
      description: Tìm kiếm và hiển thị thông tin chi tiết của một cảnh báo cụ thể thông qua mã định danh UUID.
      operationId: getAlertById
      tags:
        - Alerts
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertMessage'

  /alerts:
    post:
      summary: Đẩy một cảnh báo mới
      description: Tạo và phát tán một sự kiện cảnh báo mới dựa trên các điều kiện bất thường từ hệ thống giám sát.
      operationId: createAlert
      tags:
        - Alerts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertInput'
      responses:
        '200':
          description: Tiếp nhận thành công
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Sai nghiệp vụ hoặc thiếu trường dữ liệu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - service
        - time
      properties:
        status:
          type: string
          example: "ok"
        service:
          type: string
        time:
          type: string
          format: date-time
    AlertInput:
      type: object
      required:
        - sourceService
        - alertType
        - severity
        - message
      properties:
        sourceService:
          type: string
        alertType:
          type: string
        severity:
          type: string
          example: "HIGH"
        message:
          type: string
    AlertMessage:
      type: object
      required:
        - id
        - sourceService
        - alertType
        - severity
        - message
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        sourceService:
          type: string
        alertType:
          type: string
        severity:
          type: string
          example: "HIGH"
        message:
          type: string
        relatedEventId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          example: "OPEN"
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - code
              - message
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string